schema_version: 2

ensemble:
  id: workshop
  name: WORKSHOP
  band: South-East Sounds Workshop

# Each chair:
#   reads:      reading groups (config/reading_groups.yaml) this chair can play
#   prefer:     good substitutes when the piece has no part for this chair, best first
#   compromise: readable but not ideal (range, style); used last and flagged in builds
# "flex N" means part N of a flexible arrangement, in any group the chair reads.

parts:
  - id: flute_1
    label: Flute 1
    reads: [c_treble]
    prefer: [flute, flex 1]

  - id: flute_2
    label: Flute 2
    reads: [c_treble]
    prefer: [flute_1, flute, flex 2]

  - id: clarinet_1
    label: Clarinet 1
    reads: [bb_treble]
    prefer: [flex 1]

  - id: clarinet_2
    label: Clarinet 2
    reads: [bb_treble]
    prefer: [clarinet_1, flex 2]

  - id: clarinet_3
    label: Clarinet 3
    reads: [bb_treble]
    prefer: [clarinet_2, clarinet_1, flex 2]

  - id: alto_sax_1
    label: Alto Sax 1
    reads: [eb_treble]
    prefer: [flex 3]

  - id: alto_sax_2
    label: Alto Sax 2
    reads: [eb_treble]
    prefer: [alto_sax_1, flex 3]

  - id: tenor_sax
    label: Tenor Sax
    reads: [bb_treble]
    prefer: [flex 3, flex 4]
    compromise: [baritone_tc, euphonium_tc, trombone_tc, bass_clarinet]

  - id: trumpet_1
    label: Trumpet 1
    reads: [bb_treble]
    prefer: [flex 1]

  - id: trumpet_2
    label: Trumpet 2
    reads: [bb_treble]
    prefer: [trumpet_1, flex 2]

  - id: trumpet_3
    label: Trumpet 3
    reads: [bb_treble]
    prefer: [trumpet_2, trumpet_1, flex 2]

  - id: trombone_1
    label: Trombone 1
    reads: [c_bass]
    prefer: [trombone, baritone, euphonium, flex 3, flex 4]

  - id: trombone_2
    label: Trombone 2
    reads: [c_bass]
    prefer: [trombone_1, trombone, baritone, euphonium, flex 4, flex 3]

  - id: euphonium_tc
    label: Euphonium TC
    reads: [bb_treble]
    prefer: [baritone_tc, bass_clarinet, trombone_tc, flex 4, flex 3]
    compromise: [tenor_sax, flex 5]

  - id: baritone_tc
    label: Baritone TC
    reads: [bb_treble]
    prefer: [euphonium_tc, bass_clarinet, trombone_tc, flex 4, flex 3]
    compromise: [tenor_sax, flex 5]

  - id: bass_guitar
    label: Bass Guitar
    reads: [c_bass]
    prefer: [tuba, cello, flex 5]

  - id: guitar
    label: Guitar
    reads: [c_treble]
    compromise: [flute]

  - id: piano
    label: Piano
    reads: [c_treble, c_bass]
    prefer: [keyboard, mallets]
    compromise: [flute]

  # Every percussion part in each piece, in PDF order: percussionists move
  # between instruments. A piece's assignment can list the parts instead.
  - id: percussion
    label: Percussion
    reads: [percussion]
    takes: all
