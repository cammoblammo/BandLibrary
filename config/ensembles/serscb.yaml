schema_version: 2

ensemble:
  id: serscb
  name: SERSCB
  band: South East Regional Schools Concert Band

# Each chair:
#   reads:      reading groups (config/reading_groups.yaml) this chair can play
#   prefer:     good substitutes when the piece has no part for this chair, best first
#   compromise: readable but not ideal (range, style); used last and flagged in builds
# "flex N" means part N of a flexible arrangement, in any group the chair reads.

parts:
  - id: flute
    label: Flute
    reads: [c_treble]
    prefer: [flute_1, flex 1]

  - id: clarinet_1
    label: Clarinet 1
    reads: [bb_treble]
    prefer: [flex 1]

  - id: clarinet_2
    label: Clarinet 2
    reads: [bb_treble]
    prefer: [clarinet_1, flex 2]

  - id: clarinet_3
    label: Clarinet 3
    reads: [bb_treble]
    prefer: [clarinet_2, clarinet_1, flex 2]

  - id: alto_sax_1
    label: Alto Sax 1
    reads: [eb_treble]
    prefer: [flex 3]

  - id: alto_sax_2
    label: Alto Sax 2
    reads: [eb_treble]
    prefer: [alto_sax_1, flex 3]

  - id: alto_sax_3
    label: Alto Sax 3
    reads: [eb_treble]
    prefer: [alto_sax_2, alto_sax_1, flex 3]

  - id: tenor_sax
    label: Tenor Sax
    reads: [bb_treble]
    prefer: [flex 3, flex 4]
    compromise: [baritone_tc, euphonium_tc, trombone_tc, bass_clarinet]

  - id: trumpet_1
    label: Trumpet 1
    reads: [bb_treble]
    prefer: [flex 1]

  - id: trumpet_2
    label: Trumpet 2
    reads: [bb_treble]
    prefer: [trumpet_1, flex 2]

  - id: trumpet_3
    label: Trumpet 3
    reads: [bb_treble]
    prefer: [trumpet_2, trumpet_1, flex 2]

  - id: tenor_horn
    label: Tenor Horn
    reads: [eb_treble]
    prefer: [flex 3]
    compromise: [alto_clarinet, alto_sax_1]

  - id: trombone
    label: Trombone
    reads: [c_bass]
    prefer: [baritone, euphonium, flex 3, flex 4]

  - id: trombone_tc
    label: Trombone TC
    reads: [bb_treble]
    prefer: [euphonium_tc, baritone_tc, bass_clarinet, flex 4, flex 3]
    compromise: [tenor_sax]

  - id: baritone
    label: Baritone
    reads: [c_bass]
    prefer: [euphonium, trombone, flex 4, flex 3]

  - id: euphonium
    label: Euphonium
    reads: [c_bass]
    prefer: [baritone, trombone, flex 4, flex 3]

  - id: euphonium_tc
    label: Euphonium TC
    reads: [bb_treble]
    prefer: [baritone_tc, bass_clarinet, trombone_tc, flex 4, flex 3]
    compromise: [tenor_sax, flex 5]

  - id: baritone_tc
    label: Baritone TC
    reads: [bb_treble]
    prefer: [euphonium_tc, bass_clarinet, trombone_tc, flex 4, flex 3]
    compromise: [tenor_sax, flex 5]

  - id: bass_guitar
    label: Bass Guitar
    reads: [c_bass]
    prefer: [tuba, cello, flex 5]

  - id: guitar
    label: Guitar
    reads: [c_treble]
    compromise: [oboe, flute]

  - id: piano
    label: Piano
    reads: [c_treble, c_bass]
    prefer: [keyboard, mallets]
    compromise: [oboe, flute]

  - id: drum_kit
    label: Drum Kit
    reads: [percussion]
    prefer: [drums]
    compromise: [auxiliary_percussion]

  - id: auxiliary_percussion
    label: Auxiliary Percussion
    reads: [percussion]
    prefer: [drum_kit]
